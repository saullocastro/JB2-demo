# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: Install MyST
        run: npm install -g mystmd

      # Setup tools for PDF generation
      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install LaTeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-lmodern \
            pandoc

      # Build 1: Generate Presentations (Typst and Beamer PDFs)
      - name: Build Presentations with Make
        run: make all

      - name: Upload Presentation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated Presentations
          path: presentations/

      # Build 2: Generate Report PDFs (MyST outputs)
      - name: Build Report PDFs
        run: myst build --pdf --typst

      - name: Upload Report PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Report PDFs
          path: exports/*.pdf
          compression-level: 0
        continue-on-error: true

      # Build 3: Generate HTML Website
      - name: Build HTML Website
        run: myst build --html

      # Integrate all outputs into the website
      - name: Prepare downloads directory
        run: |
          mkdir -p _build/site/downloads
      
      - name: Verify generated files
        run: |
          echo "=== Checking for generated files ==="
          echo "Presentations directory:"
          ls -lah presentations/ || echo "No presentations directory"
          echo ""
          echo "Exports directory:"
          ls -lah exports/ || echo "No exports directory"
          echo ""
          echo "Build directory:"
          ls -lah _build/site/ || echo "No build directory"
          
      - name: Copy Report PDFs to downloads
        run: |
          if [ -f ./exports/report_tex.pdf ]; then
            cp ./exports/report_tex.pdf _build/site/downloads/
            echo "✓ Copied report_tex.pdf"
          else
            echo "✗ report_tex.pdf not found"
          fi
          if [ -f ./exports/report_typst.pdf ]; then
            cp ./exports/report_typst.pdf _build/site/downloads/
            echo "✓ Copied report_typst.pdf"
          else
            echo "✗ report_typst.pdf not found"
          fi
      
      - name: Copy Presentation PDFs to downloads
        run: |
          if [ -f ./presentations/combined_beamer_presentation.pdf ]; then
            cp ./presentations/combined_beamer_presentation.pdf _build/site/downloads/
            echo "✓ Copied combined_beamer_presentation.pdf"
          else
            echo "✗ combined_beamer_presentation.pdf not found"
          fi
          if [ -d ./presentations ]; then
            mkdir -p _build/site/downloads/presentations
            cp ./presentations/*_typst.pdf _build/site/downloads/presentations/ 2>/dev/null && \
              echo "✓ Copied individual Typst PDFs" || \
              echo "⚠ No individual Typst PDFs found"
          fi
      
      - name: List final downloads directory
        run: |
          echo "=== Final downloads directory structure ==="
          find _build/site/downloads -type f -ls 2>/dev/null || echo "Downloads directory is empty or not found"

      # Deploy to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
