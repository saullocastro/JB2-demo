version: 1
project:
  title: TU Delft's JB Starterkit
  # description:
  keywords: [Jupyter Book, Open Science, TU Delft, Starterkit]
  authors: [Freek Pols]
  github: https://github.com/TUD-JB-OS/starterkit
  date: 2026-01-31
  
  bibliography:
  - reference.bib

  exclude:
  - presentations/
  
extends:
  - toc.yml     # includes table of contents
  - export.yml  # includes export configurations
  
site:
  template: book-theme
  options:
    favicon: figures/favicon.ico
    logo: figures/tudelft.png
    logo_dark: figures/tudelft-dark.png
    css:
      - _static/custom.css
  actions:
    - title: PDF
      url: ./downloads/report_tex.pdf
    - title: Typst PDF
      url: ./downloads/report_typst.pdf
    - title: Beamer Presentation
      url: ./downloads/combined_beamer_presentation.pdf